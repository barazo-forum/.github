name: Update Contributors

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributors:
    name: Update contributor avatars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and deduplicate contributors
        uses: actions/github-script@v7
        id: contributors
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Curated contributor list. listContributors only counts public-repo
            // commits, so it missed external contributors working on private Sifa
            // repos. Fetch each user's current avatar by login instead. Add new
            // contributors here.
            const logins = ['gxjansen', 'StevenLangbroek', 'nmokkenstorm'];
            const cells = [];

            for (const login of logins) {
              try {
                const { data } = await github.rest.users.getByUsername({ username: login });
                cells.push(
                  `<a href="https://github.com/${data.login}"><img src="${data.avatar_url}&s=80" width="80" alt="@${data.login}" /></a>`
                );
              } catch (e) {
                console.log(`Skipping ${login}: ${e.message}`);
              }
            }

            const fs = require('fs');
            fs.writeFileSync('contributors-fragment.html', cells.join('\n'));
            console.log(`Generated ${cells.length} contributors`);

      - name: Update README
        run: |
          # Replace content between markers using the generated fragment
          awk '
            /<!-- CONTRIBUTORS:START -->/ {
              print
              while ((getline line < "contributors-fragment.html") > 0) print line
              skip=1; next
            }
            /<!-- CONTRIBUTORS:END -->/ { skip=0 }
            !skip { print }
          ' profile/README.md > profile/README.md.tmp
          mv profile/README.md.tmp profile/README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "docs: update contributor avatars [automated]"
          git push
